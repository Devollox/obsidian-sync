name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: preflight
    if: needs.preflight.outputs.exists == 'false'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            wails_platform: windows/amd64
          - platform: macos
            os: macos-latest
            wails_platform: darwin/universal
          - platform: linux
            os: ubuntu-22.04
            wails_platform: linux/amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gcc \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -clean -platform ${{ matrix.wails_platform }}

      - name: Extract version
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Windows artifact
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mv "build/bin/obsync.exe" \
             "build/bin/obsync.exe"

      - name: Prepare macOS artifact
        if: matrix.platform == 'macos'
        run: |
          APP_PATH="build/bin/obsync.app"
          DMG_PATH="build/bin/obsync.dmg"
          hdiutil create -volname "obsync" \
            -srcfolder "$APP_PATH" \
            -ov -format UDBZ "$DMG_PATH"

      - name: Prepare Linux artifact
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p pkg/obsync/DEBIAN
          mkdir -p pkg/obsync/usr/bin
          cp "build/bin/obsync" "pkg/obsync/usr/bin/obsync"
          chmod 755 "pkg/obsync/usr/bin/obsync"
          cat > pkg/obsync/DEBIAN/control <<EOF
          Package: obsync
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Devollox <anisin.97@bk.ru>
          Description: Lightweight Obsidian vault sync tool
          EOF
          dpkg-deb --build pkg/obsync "build/bin/obsync.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            build/bin/obsync.exe
            build/bin/obsync.dmg
            build/bin/obsync.deb
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
